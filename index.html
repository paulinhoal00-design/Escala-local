<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let deferredPrompt = null, waitingWorker = null, installed = false;
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const banner = $('install-banner');
  const installButton = $('installNow');
  const menuButton = $('installMenu');
  const status = $('pwa-status');
  function message(text) {
    status.textContent = text;
    status.classList.remove('hidden');
  }
  function updateUI() {
    if (installed || standalone()) {
      banner.classList.add('hidden');
      menuButton.textContent = '✓ Aplicativo instalado';
      return;
    }
    menuButton.textContent = deferredPrompt ? '↓ Instalar aplicativo' : '↓ Instalação do aplicativo';
    if (deferredPrompt) banner.classList.remove('hidden');
  }
  // Instalação independente da abertura do banco local.
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredPrompt = event;
    installButton.disabled = false;
    updateUI();
  });
  window.addEventListener('appinstalled', () => {
    installed = true;
    deferredPrompt = null;
    updateUI();
    message('Instalação confirmada pelo navegador. Procure Minha Escala nos aplicativos.');
  });
  async function install() {
    if (installed || standalone()) {
      message('Minha Escala já está instalada ou aberta como aplicativo.');
      return;
    }
    if (!deferredPrompt) {
      message('O navegador ainda não liberou a instalação. Abra este endereço diretamente no Chrome, use o aplicativo por alguns instantes e verifique o menu ⋮. Se aparecer “já instalado”, procure Minha Escala em Configurações → Aplicativos.');
      return;
    }
    const prompt = deferredPrompt;
    deferredPrompt = null;
    installButton.disabled = true;
    try {
      await prompt.prompt();
      const choice = await prompt.userChoice;
      if (!installed) message(choice.outcome === 'accepted'
        ? 'Solicitação aceita. Aguarde a conclusão da instalação pelo navegador.'
        : 'Instalação cancelada. Você pode tentar novamente pelo menu do navegador.');
    } catch (error) {
      console.error('Falha no convite de instalação:', error);
      message('Não foi possível abrir o convite de instalação. Tente pelo menu ⋮ do Chrome.');
    } finally {
      banner.classList.add('hidden');
      installButton.disabled = false;
      updateUI();
    }
  }
  installButton.onclick = install;
  menuButton.onclick = () => { $('sidebar').classList.add('hidden'); install(); };
  $('installDismiss').onclick = () => banner.classList.add('hidden');
  matchMedia('(display-mode: standalone)').addEventListener('change', updateUI);
  updateUI();
  if (!('serviceWorker' in navigator) || !window.isSecureContext) {
    message('Para instalar, abra o aplicativo por HTTPS no Chrome.');
    return;
  }
  let hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // Não interromper um convite de instalação na primeira ativação.
    if (hadController && !reloading) { reloading = true; location.reload(); }
    hadController = true;
  });
  $('updateNow').onclick = () => {
    if (waitingWorker) waitingWorker.postMessage({type:'skipWaiting'});
  };
  navigator.serviceWorker.register('./sw.js', {scope:'./', updateViaCache:'none'}).then(reg => {
    const showUpdate = () => {
      waitingWorker = reg.waiting;
      if (waitingWorker && navigator.serviceWorker.controller) {
        banner.classList.add('hidden');
        $('update-toast').classList.remove('hidden');
      }
    };
    const watch = worker => {
      if (!worker) return;
      worker.addEventListener('statechange', () => {
        if (worker.state === 'installed') showUpdate();
        if (worker.state === 'redundant') message('A atualização do aplicativo não foi concluída. Confira se todos os arquivos do pacote foram publicados e recarregue a página.');
      });
    };
    showUpdate(); watch(reg.installing);
    reg.addEventListener('updatefound', () => watch(reg.installing));
  }).catch(error => {
    console.error('Falha no Service Worker:', error);
    message('Não foi possível preparar a instalação. Confira a publicação do sw.js e dos ícones e recarregue o site.');
  });
})();

</script>

)))throw Error('Há ocorrências vinculadas ao nome anterior. Mantenha o nome ou remova essas ocorrências antes de alterá-lo.');if(p)await updateDoc(record('periods',p.id),payload);else await addDoc(path('periods'),payload)},p?()=>deleteDoc(record('periods',p.id)):null)}
function exceptionModal(x,date=selected){const people=new Map(data.periods.map(p=>[personKey(p),personName(p)]));if(x&&!people.has(x.personKey||'__legacy'))people.set(x.personKey||'__legacy','Grupo original / sem período');if(!people.size)return notify('Aplique uma escala a uma pessoa ou equipe primeiro.');const options=[...people].map(([key,name])=>`<option value="${esc(key)}">${esc(name)}</option>`).join('');modal(x?'Editar ocorrência':'Nova ocorrência',field('Data','fDate',x?.date||date,'date')+`<div class="field"><label for="fPersonKey">Pessoa / equipe</label><select id="fPersonKey">${options}</select></div><div class="field"><label for="fType">Tipo</label><select id="fType"><option value="extra">Folga extra / banco de horas / férias</option><option value="work">Trabalho extra / troca de turno</option></select></div><div class="field"><label for="fExShift">Período do trabalho extra / troca</label><select id="fExShift"><option value="">Manter período do modelo</option><option value="day">☀️ Diurno</option><option value="night">🌙 Noturno</option></select></div>`+field('Descrição','fLabel',x?.label||'Folga extra')+`<p class="muted">Afeta apenas esta pessoa / equipe nesta data, sem deslocar o ciclo. O horário permanece o do modelo; descreva eventuais ajustes na descrição.</p>`,async()=>{const payload={date:$('fDate').value,personKey:$('fPersonKey').value,type:$('fType').value,label:$('fLabel').value.trim(),shift:$('fExShift').value};if(!payload.label)throw Error('Preencha a descrição.');if(!schedule(payload.date).some(r=>r.key===payload.personKey))throw Error('Esta pessoa / equipe não tem período aplicado nesta data.');if(data.exceptions.some(e=>e.date===payload.date&&(e.personKey||'__legacy')===payload.personKey&&e.id!==x?.id))throw Error('Já existe uma ocorrência desta pessoa nesse dia. Edite a existente.');if(x)await updateDoc(record('exceptions',x.id),payload);else await addDoc(path('exceptions'),payload)},x?()=>deleteDoc(record('exceptions',x.id)):null);$('fPersonKey').value=x?.personKey|| (x?'__legacy':[...people.keys()][0]);$('fType').value=x?.type||'extra';$('fExShift').value=x?.shift||''}

async function importBackup(e){
 const file=e.target.files[0];if(!file)return;
 try{
  if(file.size>3e6)throw Error('Arquivo muito grande.');
  const obj=JSON.parse(await file.text());
  if(obj.app!=='minha-escala'||obj.version!==1||!obj.data)throw Error('Formato de backup inválido.');
  const ops=[];
  for(const kind of STORE_NAMES){
   if(!Array.isArray(obj.data[kind]))throw Error('Dados inválidos: '+kind);
   for(const item of obj.data[kind]){
    if(!item||typeof item.id!=='string'||! /^[A-Za-z0-9_-]{1,200}$/.test(item.id))throw Error('ID inválido no backup.');
    const {id,...payload}=item;
    const str=(key,max=10000)=>typeof payload[key]==='string'&&payload[key].length<=max;
    const date=key=>str(key,10)&&/^\d{4}-\d{2}-\d{2}$/.test(payload[key]);
    if(kind==='scales'&&!(str('name',200)&&str('pattern',366)&&/^[TF]+$/.test(payload.pattern)))throw Error('Escala inválida no backup.');
    if(kind==='periods'&&!(str('scaleId',200)&&date('start')&&(!payload.end||date('end'))&&(!payload.anchor||date('anchor'))))throw Error('Período inválido no backup.');
    if(kind==='exceptions'&&!(date('date')&&str('label')&&['work','extra'].includes(payload.type)))throw Error('Ocorrência inválida no backup.');
    if(kind==='events'&&!(date('date')&&str('title')&&str('notes')))throw Error('Nota inválida no backup.');
    if(kind==='preferences'&&!(id==='visual'&&['dark','light','auto'].includes(payload.theme)&&['workColor','offColor','extraColor'].every(k=>str(k,7)&&/^#[a-fA-F0-9]{6}$/.test(payload[k]))))throw Error('Preferências inválidas no backup.');
    if(kind==='scales'&&((payload.color!==undefined&&!/^#[a-fA-F0-9]{6}$/.test(payload.color))||(payload.shift!==undefined&&!['day','night'].includes(payload.shift))))throw Error('Cor ou período inválido.');
    if(kind==='periods'&&payload.color!==undefined&&!/^#[a-fA-F0-9]{6}$/.test(payload.color))throw Error('Cor inválida.');
    if(kind==='periods'&&payload.personName!==undefined&&!str('personName',200))throw Error('Nome inválido.');
    if(kind==='exceptions'&&((payload.personKey!==undefined&&!str('personKey',200))||(payload.shift!==undefined&&!['','day','night'].includes(payload.shift))))throw Error('Pessoa ou período inválido.');
    ops.push({type:'set',ref:record(kind,id),payload});
   }
  }
  if(ops.length>2000)throw Error('Backup excede o limite de 2000 registros.');
  if(!confirm(`Importar ${ops.length} registros neste dispositivo? IDs iguais serão substituídos.`))return;
  await commitLocal(ops);notify('Backup importado com sucesso');
 }catch(error){notify('Erro na importação: '+error.message);}
 e.target.value='';
}

// Usa sempre o mês de navegação, sem alterar o dia selecionado ou o banco.
function prepareMonthPrint(){
 const y=view.getFullYear(),m=view.getMonth(),offset=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 const people=new Map(),cells=[];
 for(let n=0;n<offset;n++)cells.push('<td class="print-blank"></td>');
 for(let d=1;d<=days;d++){
  const date=localISO(new Date(y,m,d)),rows=schedule(date);
  for(const r of rows){const key=JSON.stringify([r.key,r.shift,r.scale.startTime,r.scale.endTime,crewColor(r.scale)]);if(!people.has(key))people.set(key,r)}
  const shifts=['day','night'].map(shift=>{
   const workers=rows.filter(r=>r.working&&r.shift===shift);
   return `<div class="print-shift">${shift==='day'?'Diurno':'Noturno'}</div>${workers.map(r=>`<div class="print-person" style="--crew:${crewColor(r.scale)}">${esc(r.name)}${r.exception?' ★':''}</div>`).join('')||'<div class="print-empty">—</div>'}`;
  }).join('');
  cells.push(`<td><div class="print-date">${d}</div>${shifts}</td>`);
 }
 while(cells.length%7)cells.push('<td class="print-blank"></td>');
 let weeks='';for(let n=0;n<cells.length;n+=7)weeks+=`<tr>${cells.slice(n,n+7).join('')}</tr>`;
 const legend=[...people.values()].map(r=>`<span style="--crew:${crewColor(r.scale)}"><strong>${esc(r.name)}</strong> · ${r.shift==='day'?'Diurno':'Noturno'}${r.scale.startTime&&r.scale.endTime?' · '+esc(r.scale.startTime)+'–'+esc(r.scale.endTime):''}</span>`).join('');
 $('month-print').innerHTML=`<h1>Escala — ${esc(monthName(y,m))}</h1><p class="print-subtitle">Quem trabalha em cada dia · Diurno e noturno</p><table aria-label="Escala mensal"><thead><tr>${['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map(day=>`<th scope="col">${day}</th>`).join('')}</tr></thead><tbody>${weeks}</tbody></table>${legend?`<div class="print-key">${legend}</div>`:'<p class="print-footnote">Nenhuma escala aplicada neste mês.</p>'}<p class="print-footnote">O noturno aparece na data de início do plantão. ★ Trabalho extra ou troca individual. — Sem plantão no período.</p>`;
}
function printMonth(){
 $('sidebar').classList.add('hidden');
 if(syncState==='Abrindo banco local…'||syncState==='Banco local indisponível'){notify('Aguarde o carregamento das escalas antes de imprimir.');return}
 try{prepareMonthPrint();window.print()}catch(error){notify('Não foi possível abrir a impressão. Tente pelo menu do navegador.');console.error(error)}
}
window.addEventListener('beforeprint',prepareMonthPrint);

$('printMonthMenu').onclick=printMonth;
render();connect();$('closeNav').onclick=()=>$('sidebar').classList.add('hidden');$('sidebar').onclick=e=>{if(e.target===$('sidebar'))$('sidebar').classList.add('hidden')};document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{page=el.dataset.page;$('sidebar').classList.add('hidden');render()});
</script></body></html>
